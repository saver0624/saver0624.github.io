<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>留言板</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Courier New", monospace;
        background: #12101a;
        color: #fff;
        overflow: hidden;
      }
      .pixel-hearts {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        font-size: 26px;
        color: #ff4f7b;
        line-height: 1.15;
        white-space: pre;
        text-align: center;
      }
      .content {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 20px;
        animation: fadeIn 3s ease forwards;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .name {
        font-size: clamp(44px, 9vw, 80px);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #00ffa3;
        text-shadow:
          0 0 16px rgba(0, 255, 163, 0.5),
          4px 4px 0 #7a2d3f;
        margin-bottom: 24px;
      }
      .message {
        font-size: clamp(18px, 3.5vw, 30px);
        letter-spacing: 0.2em;
        color: #ff4f7b;
        text-shadow:
          0 0 14px rgba(255, 79, 123, 0.5),
          3px 3px 0 #2d1f7a;
        opacity: 0;
        animation: fadeIn 2s ease 1.4s forwards;
      }
      .message::after {
        content: "|";
        animation: blink 1s step-end infinite;
        margin-left: 4px;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .hud {
        margin-top: 40px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 0.4em;
        opacity: 0;
        animation: fadeIn 2s ease 2.6s forwards;
      }
      .hud .heart {
        color: #ff4f7b;
        text-shadow: 0 0 8px #ff4f7b;
      }
    </style>
  </head>
  <body>
    <div class="pixel-hearts" id="ph"></div>
    <div class="content">
      <div class="name">宝宝～</div>
      <div class="message">
        太阳晒屁股啦起床没有呀？我今天中午在公司楼下吃的大抄手！真的超级超级大，味道也很好吃呢，改天来接我下班带你吃超级超级大抄手～
      </div>
      <div class="hud">LOVE<span class="heart">♥♥♥♥♥</span> 爱你的白</div>
    </div>
    <script>
      // 像素爱心雨
      const el = document.getElementById("ph");
      let rows = [];
      function build() {
        const w = Math.floor(window.innerWidth / 28) || 20;
        const h = Math.floor(window.innerHeight / 30) || 20;
        rows = Array.from({ length: h }, () =>
          Array.from({ length: w }, () => (Math.random() < 0.03 ? "♥" : "·")),
        );
      }
      build();
      window.addEventListener("resize", build);
      function render() {
        // 随机生成新爱心
        for (let i = 0; i < rows.length; i++) {
          if (Math.random() < 0.02)
            rows[i][Math.floor(Math.random() * rows[i].length)] = "♥";
        }
        // 下落
        const bottom = rows[rows.length - 1];
        for (let i = rows.length - 1; i > 0; i--) rows[i] = rows[i - 1];
        rows[0] = bottom.map(() => (Math.random() < 0.05 ? "♥" : "·"));
        el.textContent = rows.map((r) => r.join(" ")).join("\n");
        requestAnimationFrame(() => setTimeout(render, 120));
      }
      render();
    </script>
  </body>
</html>
